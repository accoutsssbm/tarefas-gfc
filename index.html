<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de Atividades GFC · Sotreq</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Paleta do Manual de Identidade Visual Sotreq (Relatórios de BI) */
:root{
  color-scheme:light;
  --amarelo:#FDBA12; --amarelo-claro:#FEE3A0; --preto:#000000; --cinza:#E6E6E6; --branco:#FFFFFF;
  --txt:#000000; --muted:#5C5C5C; --linha:#D9D9D9;
  --verde:#00B505; --verde-bg:#E8FFE4; --vermelho:#FF2323; --vermelho-bg:#FFF0F0;
  --azul:#4C78FF; --azul-bg:#EBF5FF; --am-forte:#FFD000; --am-bg:#FFFEE7; --am-escuro:#A66D02;
  --font:"Segoe UI Semibold","Segoe UI","Segoe UI Variable",Arial,sans-serif;
  --font-bold:"Segoe UI","Segoe UI Variable",Arial,sans-serif;
  --font-black:"Arial Black","Arial Bold",Arial,sans-serif;
  --side:233px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--cinza);color:var(--txt);font:600 15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--preto);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- barra lateral ---------- */
.side{position:fixed;left:0;top:0;bottom:0;width:var(--side);display:flex;flex-direction:column;border-radius:0 14px 14px 0;z-index:10;padding:18px 14px 16px}
.side::after{content:"";position:absolute;top:0;bottom:0;right:-5px;width:5px;border-radius:0 8px 8px 0;background:var(--amarelo-claro)}
.front .side{background:var(--amarelo);color:var(--preto)}
.interna .side{background:var(--preto);color:var(--branco)}
.interna .side::after{display:none}
.logo{display:block;border:2px solid var(--branco);background:var(--branco);line-height:0;margin-bottom:6px}
.logo img{display:block;width:100%;height:auto}
.logo-sub{font-size:12px;text-align:center;margin-bottom:14px;opacity:.85}
.front .logo{border-color:var(--branco)}
.nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
.nav .sec{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin:10px 6px 4px}
.nav button{display:flex;align-items:center;gap:8px;background:none;border:0;text-align:left;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:14.5px;color:inherit}
.interna .nav button:hover,.interna .nav button[aria-current="page"]{color:var(--amarelo)}
.front .nav button:hover{background:rgba(0,0,0,.08)}
.front .nav button[aria-current="page"]{background:var(--preto);color:var(--branco)}
.nav .b{margin-left:auto;min-width:22px;height:20px;border-radius:10px;font-size:11.5px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.front .nav .b{background:var(--preto);color:var(--amarelo)}
.interna .nav .b{background:var(--amarelo);color:var(--preto)}
.nav .b.ok{background:var(--verde);color:#fff}
.side-foot{font-size:12.5px;text-align:center;line-height:1.35;padding-top:12px}
.side-foot b{display:block}

/* ---------- barra superior ---------- */
.wrap{margin-left:calc(var(--side) + 5px);min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:8;min-height:64px;padding:8px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-radius:14px 14px 0 0}
.front .topbar{background:var(--preto);color:var(--branco);box-shadow:0 6px 0 var(--amarelo-claro)}
.interna .topbar{background:var(--amarelo);color:var(--preto)}
.topbar h1{margin:0;font:700 22px/1.1 var(--font-bold)}
.topbar .sp{flex:1}
.flt{display:flex;flex-direction:column;gap:3px;font-size:12px}
.flt .box{background:var(--branco);color:var(--preto);border-radius:3px;padding:5px 10px;font-size:13.5px;min-width:130px;border:0;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px}
.flt .box input{width:16px;height:16px;margin:0}

/* ---------- área de conteúdo ---------- */
.content{background:var(--branco);margin:14px 14px 14px;border-radius:14px;padding:18px 20px;flex:1;border:1px solid var(--linha)}
h2{font:700 20px/1.2 var(--font-bold);margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px;font-weight:600}

/* cartões de indicador (versão nova do manual) */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.kpi{border:1px solid var(--linha);border-radius:8px;background:var(--branco);overflow:hidden;display:flex;flex-direction:column;position:relative;padding-left:5px;cursor:default}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.kpi .t{padding:8px 10px 0;font-size:13.5px}
.kpi .v{padding:0 10px 6px;font:700 26px/1.15 var(--font-bold)}
.kpi .f{background:var(--cb);padding:6px 10px;font-size:12.5px}
.k-eu{--c:var(--amarelo);--cb:var(--amarelo-claro)}
.k-esp{--c:var(--azul);--cb:var(--azul-bg)}
.k-lock{--c:#A6A6A6;--cb:#F2F2F2}
.k-ok{--c:var(--verde);--cb:var(--verde-bg)}

/* foco */
.foco{border:1px solid var(--amarelo);border-left:4px solid var(--amarelo);background:var(--am-bg);border-radius:10px;padding:10px 16px;margin-bottom:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.foco .l{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--am-escuro)}
.foco .x{font:700 17px/1.3 var(--font-bold)}
.foco.ok{border-color:var(--verde);border-left-color:var(--verde);background:var(--verde-bg)}
.foco.ok .l{color:#028907}
.foco .acts{display:flex;gap:8px;flex-wrap:wrap}

.btn{border:1px solid #BDBDBD;background:var(--branco);border-radius:6px;padding:8px 14px;cursor:pointer;font-size:14px;font-weight:600}
.btn:hover{border-color:var(--preto)}
.btn.am{background:var(--amarelo);border-color:var(--amarelo)}
.btn.pr{background:var(--preto);color:var(--branco);border-color:var(--preto)}
.btn.sm{padding:4px 10px;font-size:13px}
.lnk{background:none;border:0;padding:2px 0;text-decoration:underline;cursor:pointer;font-size:12.5px;color:var(--muted)}

/* sites na visão geral */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tile{border:1px solid var(--linha);border-radius:8px;background:var(--branco);padding:11px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
.tile:hover{border-color:var(--preto)}
.tile .nm{font:900 16px/1.2 var(--font-black);text-transform:uppercase}
.tile .pc{font:700 24px/1 var(--font-bold)}
.tile .ln{font-size:13px;color:var(--muted)}
.tile.done{border-color:var(--verde);background:var(--verde-bg)}
.bar{height:5px;background:var(--cinza);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--amarelo)}
.tile.done .bar i{background:var(--verde)}

/* fluxo */
.fluxo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:-6px 0 16px}
.fluxo span.p{background:var(--cinza);color:var(--preto);border-radius:14px;padding:3px 10px}

/* filtro de frotas */
.filtro{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filtro .lbl{font-size:12.5px;color:var(--muted);margin-right:2px}
.chip{border:1px solid var(--linha);background:#fff;border-radius:18px;padding:5px 12px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:7px}
.chip:hover{border-color:var(--preto)}
.chip[aria-pressed="true"]{background:var(--preto);color:#fff;border-color:var(--preto)}
.chip .n{min-width:19px;height:19px;border-radius:10px;background:var(--amarelo);color:var(--preto);font-size:11px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.chip .n.ok{background:var(--verde);color:#fff}
.chip .n.esp{background:var(--azul-bg);color:#203CE2}
.resumo{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-left:auto}
.resumo i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.row.done .an{color:var(--muted)}
/* cards de frota */
.frotas{display:flex;flex-direction:column;gap:14px}
.fr{border:1px solid var(--linha);border-radius:10px;overflow:hidden}
.fr-h{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding:9px 14px;background:#FAFAFA;border-bottom:1px solid var(--linha)}
.fr-h h3{margin:0;font:700 20px/1.2 var(--font-bold)}
.fr-h .who{font-size:13.5px;color:var(--muted)}
.fr-h .who b{color:var(--preto)}
.fr-h .c{margin-left:auto;font-size:13px;color:var(--muted)}
.fr.fechada .fr-h{background:var(--verde-bg);border-bottom:0}
.fr.fechada h3::before{content:"✓ ";color:#028907}

.row{display:grid;grid-template-columns:210px minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:7px 14px;border-top:1px solid var(--linha)}
.fr-h + .row{border-top:0}
.an{font:700 15.5px/1.25 var(--font-bold)}
.an small{display:block;font:600 12.5px/1.3 var(--font);color:var(--muted)}
.tag{display:inline-block;font:600 11px/1 var(--font);padding:3px 7px;border-radius:10px;margin-left:6px;vertical-align:2px}
.tag.eu{background:var(--amarelo-claro)}
.tag.csp{background:var(--azul-bg);color:#203CE2}
.tag.cons{background:#EDE7FF;color:#4B2FB3}
.row.lock{background:#FAFAFA}
.row.lock .steps{opacity:.35;pointer-events:none}
.lockmsg{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:3px}
.row.na{opacity:.5}
.row.na .steps{pointer-events:none}
.row .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.nabtn{border:1px solid #BDBDBD;background:#fff;border-radius:6px;font-size:12px;padding:4px 8px;color:var(--muted);cursor:pointer}
.nabtn[aria-pressed="true"]{background:var(--preto);color:#fff;border-color:var(--preto)}

.steps{display:flex;align-items:flex-start}
.step{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;padding:0 4px;min-width:0}
.dotbtn{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0;position:relative;z-index:1}
.prazo{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);margin-top:1px}
.prazo input{border:1px solid var(--linha);border-radius:4px;padding:1px 4px;font-size:11.5px;background:#fff}
.prazo.late,.prazo.late input{color:#D70000;border-color:#FF9494}
.step::before{content:"";position:absolute;top:14px;right:50%;width:100%;height:1px;background:var(--cinza);z-index:0}
.step:first-child::before{display:none}
.step.on::before{background:var(--verde);height:2px}
.dot{width:30px;height:30px;border-radius:50%;border:1.5px solid #CFCFCF;background:#fff;display:flex;align-items:center;justify-content:center;font:700 15px/1 var(--font-bold);position:relative;z-index:1;color:var(--muted)}
.step.outro .dot{border-style:dashed}
.step.on .dot{background:var(--verde);border:1.5px solid var(--verde);color:#fff}
.step.next .dot{background:var(--amarelo);border:1.5px solid var(--preto);color:var(--preto);box-shadow:0 0 0 3px var(--amarelo-claro)}
.step.next.outro .dot{background:var(--azul-bg);border:1.5px dashed var(--azul);color:var(--azul);box-shadow:none}
.step .sl{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.2}
.step.next .sl,.step.on .sl{color:var(--preto)}
.step .sd{font-size:11.5px;color:var(--muted);text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.late-txt{color:#D70000;font-size:11.5px}
.step .sd.late{color:var(--vermelho)}
.dotbtn:hover .dot{border-color:var(--preto)}
.basenote{font-size:12px}
.basenote.bad{color:var(--vermelho)}
.basenote.good{color:#028907}
.escond{padding:8px 14px 10px;border-top:1px solid var(--linha);font-size:13px;color:var(--muted)}

/* tabelas (manual: cabeçalho cinza, linhas alternadas) */
.tw{overflow-x:auto;border:1px solid var(--linha);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:#A6A6A6;color:var(--preto);text-align:left;padding:7px 8px;font-weight:700;white-space:nowrap}
td{padding:5px 8px;border-bottom:1px solid var(--cinza)}
tr:nth-child(even) td{background:#F2F2F2}
td input{width:100%;min-width:90px;border:1px solid #CFCFCF;border-radius:4px;padding:5px 7px;font-size:13.5px;background:#fff}
.box2{border:1px solid var(--linha);border-radius:8px;padding:16px;margin-bottom:14px}
.box2 h3{margin:0 0 4px;font:700 17px/1.2 var(--font-bold)}
.box2 p{margin:0 0 10px;color:var(--muted);font-size:14px}
.row-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=month],input[type=number],input[type=text].in{border:1px solid #CFCFCF;border-radius:4px;padding:6px 8px;background:#fff}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;border:1px solid var(--linha);border-left:4px solid var(--amarelo);border-radius:10px;padding:10px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 28px rgba(0,0,0,.18);max-width:92vw;z-index:30;font-size:14.5px}
.toast button{border:0;background:none;font-weight:700;text-decoration:underline;cursor:pointer}
.hidden{display:none!important}
dialog{border:1px solid var(--linha);border-radius:12px;padding:18px;width:min(560px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog textarea{width:100%;min-height:200px;border:1px solid #CFCFCF;border-radius:6px;padding:10px;font:600 14px/1.45 var(--font)}

@media (max-width:860px){
  :root{--side:0px}
  .side{position:sticky;width:auto;bottom:auto;border-radius:0;flex-direction:row;align-items:center;gap:10px;padding:10px 12px;overflow-x:auto}
  .side::after{display:none}
  .logo{margin:0;width:120px;flex:none}
  .logo-sub{display:none}
  .nav{flex-direction:row;overflow-x:auto;overflow-y:visible}
  .nav .sec,.side-foot{display:none}
  .nav button{white-space:nowrap}
  .wrap{margin-left:0}
  .topbar{border-radius:0;top:58px}
  .content{margin:10px;padding:14px}
  .row{grid-template-columns:1fr auto}
  .row .steps{grid-column:1/-1;order:3}
  .row .right{flex-direction:row}
}
</style>
</head>
<body class="front">
<aside class="side" id="side"></aside>
<div class="wrap">
  <header class="topbar" id="topbar"></header>
  <main class="content" id="main"></main>
</div>
<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>
<input type="file" id="fBase" accept=".xlsx,.xls" class="hidden">
<input type="file" id="fImp" accept=".xlsx,.xls" class="hidden">

/* ---------- migração dos formatos anteriores ---------- */
function deV2(t2){
  const d=x=>x===undefined?null:x, T=vazioT();
  const g=k=>t2&&t2[k]?t2[k]:{e:null,r:null,s:null,na:false};
  const par=(o)=>{const fim=o.s!==null&&o.s!==undefined?o.s:null;return {st:[d(o.e)??(fim!==null?'':null),fim],na:!!o.na,prazo:''}};
  T.hor=par(g('hor'));T.mapa=par(g('mapa'));
  const r=g('rom');T.rom={st:[d(r.s)],na:!!r.na,prazo:''};
  ['vida','fc'].forEach(k=>{const v=g(k);T[k]={st:[d(v.s),d(v.s)],na:!!v.na,prazo:''}});
  return T;
}
function deV3(t3){
  const T=vazioT(),g=k=>(t3&&t3[k])||{st:[],na:false};
  const h=g('hor');T.hor={st:[h.st[0]??null,h.st[1]??null],na:!!h.na,prazo:''};
  const m=g('mapa');const mf=m.st.length&&m.st.every(x=>x!==null);T.mapa={st:[m.st[0]??null,mf?(m.st[2]??''):null],na:!!m.na,prazo:''};
  const r=g('rom');T.rom={st:[r.st[0]??null],na:!!r.na,prazo:''};
  ['vida','fc'].forEach(k=>{const v=g(k);const vf=v.st.length&&v.st.every(x=>x!==null);T[k]={st:[vf?v.st[1]:null,vf?v.st[1]:null],na:!!v.na,prazo:''}});
  return T;
}
function normalizar(st){
  const ver=st.v||2;
  st.cfg=Object.assign({dias:5,responsavel:'Vitoria'},st.cfg||{});
  st.frotas=(st.frotas||[]).map(f=>{
    if(f.t&&f.t.hor&&!('st' in f.t.hor))f.t=deV2(f.t);
    else if(ver<4&&f.t)f.t=deV3(f.t);
    f.t=Object.assign(vazioT(),f.t||{});
    ATV.forEach(a=>{const t=f.t[a.k];while(t.st.length<a.steps.length)t.st.push(null);t.st.length=a.steps.length;t.prazo=t.prazo||''});
    f.csp=f.csp||'';f.resp=f.resp||'';f.modelos=f.modelos||[];f.baseCliente=f.baseCliente||'';f.id=f.id||uid();
    return f});
  if(!st.cfg.na794){st.frotas.forEach(f=>{if(semMapa(f))f.t.mapa.na=true});st.cfg.na794=true}
  st.v=4;st.salvoEm=st.salvoEm||'';
  return st;
}
function salvar(){S.salvoEm=new Date().toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});try{localStorage.setItem(LS,JSON.stringify({S,H}))}catch(e){toast('Não consegui salvar neste navegador. Exporte o Excel para não perder.')}}
function carregar(){
  const tenta=k=>{try{const c=JSON.parse(localStorage.getItem(k)||'null');if(c&&c.S)return c}catch(e){}return null};
  const c=tenta(LS)||LS_OLD.map(tenta).find(Boolean);
  if(c){S=normalizar(c.S);H=c.H||{}}
  else{try{const sd=JSON.parse($('#seed').textContent);S=normalizar(sd.state);H=sd.hist||{}}catch(e){S=normalizar({mes:hoje().slice(0,7),frotas:[]})}}
  salvar();
}
const sites=()=>[...new Set(S.frotas.map(f=>f.cliente))];

/* ---------- regras ---------- */
const feita=t=>t.na||t.st.every(x=>x!==null);
const travada=(f,a)=>a.deps.some(d=>!feita(f.t[d]));
function prox(f,a){const t=f.t[a.k];if(feita(t))return -1;if(travada(f,a))return -2;return t.st.findIndex(x=>x===null)}
function estado(f,a){const i=prox(f,a);if(f.t[a.k].na)return 'na';if(i===-1)return 'ok';if(i===-2)return 'lock';return a.steps[i].eu?'eu':'esp'}
function atraso(f,a){const i=prox(f,a);if(i<1||a.steps[i].eu)return null;const p=f.t[a.k].prazo;if(!p)return null;return dias(p)} /* >0 = dias após o prazo */
function conta(lista){const c={tot:0,ok:0,eu:0,esp:0,lock:0,late:0};lista.forEach(f=>ATV.forEach(a=>{const e=estado(f,a);if(e==='na')return;c.tot++;c[e]++;if(e==='esp'){const d=atraso(f,a);if(d!==null&&d>0)c.late++}}));c.pend=c.tot-c.ok;c.p=c.tot?Math.round(c.ok/c.tot*100):100;return c}
function sitHist(f,a){const e=estado(f,a);return {na:'NA',ok:'OK',lock:'BLOQUEADO',esp:'COBRAR'}[e]||(a.k==='rom'?'EU ATUALIZO':'COBRAR')}

/* ---------- e-mails ---------- */
const OBJ={hor:'da atualização dos horímetros',mapa:'do Mapa de Trocas de Componentes atualizado',vida:'da atualização da vida útil dos componentes',fc:'da atualização do forecast'};
const juntar=l=>l.length<2?(l[0]||''):l.slice(0,-1).join(', ')+' e '+l[l.length-1];
const saudacao=()=>{const h=new Date().getHours();return h<12?'bom dia':h<18?'boa tarde':'boa noite'};
const destDe=(f,a)=>(a.quem==='cons'?f.resp:f.csp)||'';
const semMapa=f=>/794/.test(f.frota); /* histórico de trocas não é solicitado para a 794 */
/* frotas do site que entram no mesmo e-mail (novo ou reforço) da atividade */
function lote(f,a){
  const tipo=tipoEmail(f,a);if(!tipo)return [];
  const fs=S.frotas.filter(x=>x.cliente===f.cliente&&tipoEmail(x,a)===tipo&&!(a.k==='mapa'&&semMapa(x)));
  return fs.includes(f)?fs:[f];
}
function email(fs,a,reforco){
  const nomes=[...new Set(fs.map(f=>destDe(f,a)).filter(Boolean))], multi=nomes.length>1, sd=saudacao();
  const men=juntar(nomes.map(n=>'@'+n)), frs=fs.map(f=>f.frota).join(', ');
  const alvo=multi?'de suas respectivas frotas':`${fs.length>1?'das frotas':'da frota'} ${frs}`;
  const quadro=multi?'\n\n'+[...new Set(fs.map(f=>destDe(f,a)))].map(d=>`• ${d||'Sem responsável cadastrado'}: ${fs.filter(f=>destDe(f,a)===d).map(f=>f.frota).join(', ')}`).join('\n'):'';
  const abre=`${men||'Prezados'}, ${sd}!\n\n`;
  const prazo=fmt(somaDias(hoje(),S.cfg.dias)), site=fs[0].cliente;
  if(reforco){
    const pz=fs.map(f=>f.t[a.k].prazo).filter(Boolean).sort()[0], d=pz?dias(pz):null;
    const st=!pz?'':d>0?`, cujo prazo venceu em ${fmt(pz)}`:`, com prazo em ${fmt(pz)}`;
    return `${abre}Reforço a solicitação ${OBJ[a.k]} ${alvo} (${site})${st}.${quadro}\n\nPeço, por gentileza, o retorno com a maior brevidade possível.`}
  if(a.k==='hor')return `${abre}Solicito o input/atualização dos horímetros ${alvo} (${site}), com prazo máximo até ${prazo}.${quadro}\n\nO horímetro é a base de cálculo dos demais indicadores do Índice de Qualidade. Sem a leitura atualizada, não conseguimos realizar os ajustes necessários nem fechar os indicadores dentro do prazo.`;
  if(a.k==='mapa')return `${multi?'Prezados':'Prezado(a)'}, ${sd}.\n\n${men?men+',\n\n':''}Gostaria de reforçar nosso foco na excelência do Índice de Qualidade e na manutenção da rotina de atualização do GFC. Para isso, solicito a gentileza de enviarem o Mapa de Trocas de Componentes atualizado ${alvo} (${site}) até ${prazo}.${quadro}\n\nEssa atualização é fundamental para garantirmos a precisão das nossas métricas e o alinhamento com os objetivos da área.\n\nFico à disposição para qualquer dúvida.`;
  const ver=a.k==='vida'?'vida útil dos componentes':'forecast';
  return `${abre}Segue em anexo a verificação de ${ver} ${alvo} (${site}), realizada pela área GFC e referente a ${mesNome(S.mes)}. Solicito a atualização até ${prazo}.${quadro}`;
}
function tipoEmail(f,a){const i=prox(f,a);if(i<0)return null;const s=a.steps[i];if(s.mail)return 'novo';if(!s.eu)return 'reforco';return null}
async function copiar(txt,depois,msg){
  let ok=false;try{await navigator.clipboard.writeText(txt);ok=true}catch(e){}
  if(!ok){$('#dlg').innerHTML=`<p style="margin-top:0"><b>Copie o texto abaixo</b> (Ctrl+C)</p><textarea id="tx">${esc(txt)}</textarea><div class="row-acts" style="margin-top:10px;justify-content:flex-end"><button class="btn" type="button" data-act="fechaDlg">Fechar</button></div>`;$('#dlg').showModal();$('#tx').select()}
  if(depois)toastAcao(`${ok?'Texto copiado':'Texto pronto'} (${msg}). Após o envio, registrar:`,'Registrar e-mail enviado',depois);
  else if(ok)toast(`Texto copiado (${msg}).`);
}
function copiarEmail(fid,k){
  const f=S.frotas.find(x=>x.id===fid),a=A(k),tipo=tipoEmail(f,a);if(!tipo)return;
  const fs=lote(f,a), marcar=tipo==='novo'?()=>marcarLote(fs.map(x=>x.id),k):null;
  copiar(email(fs,a,tipo==='reforco'),marcar,`${f.cliente}: ${fs.map(x=>x.frota).join(', ')}`);
}

/* ---------- ações ---------- */
function marcar_(fid,k,i){
  const f=S.frotas.find(x=>x.id===fid),a=A(k),t=f.t[k];
  undo=[{fid,t:clone(f.t)}];
  if(t.st[i]!==null){for(let j=i;j<t.st.length;j++)t.st[j]=null;if(i===0)t.prazo='';toast(`${a.n} (${f.frota}): etapa "${a.steps[i].n}" desfeita.`,true)}
  else{for(let j=0;j<=i;j++)if(t.st[j]===null)t.st[j]=hoje();
    if(a.steps[0].mail&&!t.prazo&&!feita(t))t.prazo=somaDias(hoje(),S.cfg.dias);
    toast(feita(t)?`${a.n} (${f.frota}): atividade concluída.`:`${a.n} (${f.frota}): e-mail registrado. Prazo: ${fmt(t.prazo)}.`,true)}
  salvar();render();
}
function marcarLote(ids,k){
  const a=A(k),fs=S.frotas.filter(f=>ids.includes(f.id)&&f.t[k].st[0]===null);if(!fs.length)return;
  undo=fs.map(f=>({fid:f.id,t:clone(f.t)}));
  fs.forEach(f=>{const t=f.t[k];t.st[0]=hoje();if(!t.prazo&&!feita(t))t.prazo=somaDias(hoje(),S.cfg.dias)});
  toast(`${a.n} (${fs[0].cliente}): e-mail registrado para ${fs.map(f=>f.frota).join(', ')}. Prazo: ${fmt(fs[0].t[k].prazo)}.`,true);
  salvar();render();
}
function toggleNA(fid,k){const f=S.frotas.find(x=>x.id===fid);undo=[{fid,t:clone(f.t)}];f.t[k].na=!f.t[k].na;salvar();render()}
function desfazer(){if(!undo)return;undo.forEach(u=>{const f=S.frotas.find(x=>x.id===u.fid);if(f)f.t=u.t});undo=null;salvar();render();hideToast()}

let tT=null,tFn=null;
function toast(m,u){$('#toast').innerHTML=`<span>${esc(m)}</span>${u?'<button type="button" data-act="undo">Desfazer</button>':''}`;$('#toast').classList.remove('hidden');clearTimeout(tT);tT=setTimeout(hideToast,5000)}
function toastAcao(m,b,fn){tFn=fn;$('#toast').innerHTML=`<span>${esc(m)}</span><button type="button" data-act="toastFn">${esc(b)}</button>`;$('#toast').classList.remove('hidden');clearTimeout(tT);tT=setTimeout(hideToast,15000)}
function hideToast(){$('#toast').classList.add('hidden')}

/* ---------- próximo passo ---------- */
function proximo(fs){
  for(const a of ATV)for(const f of fs){const i=prox(f,a);if(i>=0&&a.steps[i].eu)return {f,a,i}}
  let pior=null;fs.forEach(f=>ATV.forEach(a=>{const i=prox(f,a);if(i<1||a.steps[i].eu)return;const d=atraso(f,a)??-999;if(!pior||d>pior.d)pior={f,a,i,d,esp:true}}));
  return pior;
}
function textoFoco(p){
  const {f,a}=p, fr=`frota ${f.frota}${aba==='geral'?' ('+f.cliente+')':''}`;
  if(p.esp){const pz=f.t[a.k].prazo;const st=!pz?'sem prazo definido':p.d>0?`prazo vencido há ${p.d} dia${p.d===1?'':'s'}`:`prazo em ${fmt(pz)}`;
    return `Aguardando ${a.quem==='cons'?'o consultor':'o CSP'}: ${a.n.toLowerCase()} da ${fr} (${st}).`}
  const fl=lote(f,a), frs=`${fl.length>1?'frotas':'frota'} ${fl.map(x=>x.frota).join(', ')} (${f.cliente})`;
  const txt={hor:`Enviar e-mail aos CSPs solicitando a atualização dos horímetros: ${frs}.`,
    mapa:`Enviar e-mail aos consultores solicitando o mapa de trocas: ${frs}.`,
    rom:`Atualizar o ROM da ${fr} no sistema.`,
    vida:`Enviar aos CSPs a verificação de vida útil: ${frs}.`,
    fc:`Enviar aos CSPs a verificação de forecast: ${frs}.`};
  return txt[a.k];
}
function focoHtml(fs,escopo){
  const p=proximo(fs);
  if(!p)return `<div class="foco ok"><div><div class="l">Concluído</div><div class="x">Todas as atividades de ${esc(escopo)} foram concluídas no mês.</div></div></div>`;
  const tipo=tipoEmail(p.f,p.a);
  let acts='';
  if(aba==='geral'){sel[p.f.cliente]=p.f.id;acts+=`<button class="btn pr" type="button" data-aba="${esc(p.f.cliente)}">Abrir ${esc(p.f.cliente)} · ${esc(p.f.frota)}</button>`}
  if(tipo)acts+=`<button class="btn am" type="button" data-act="mail" data-fid="${p.f.id}" data-k="${p.a.k}">${p.esp?'Copiar e-mail de reforço':'Copiar texto do e-mail'}</button>`;
  if(!p.esp)acts+=`<button class="btn" type="button" data-act="passo" data-fid="${p.f.id}" data-k="${p.a.k}" data-i="${p.i}">${p.a.steps[p.i].mail?'Registrar e-mail enviado':'Registrar como concluído'}</button>`;
  return `<div class="foco"><div style="flex:1;min-width:240px"><div class="l">${p.esp?'Aguardando retorno':'Próxima ação'}</div><div class="x">${esc(textoFoco(p))}</div></div><div class="acts">${acts}</div></div>`;
}
function kpis(c){

const LOCK_SVG='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
function linha(f,a){
  const t=f.t[a.k], e=estado(f,a), i=prox(f,a), q=QUEM[a.quem];
  let info=a.sub?`<small>${a.sub}</small>`:'';
  if(e==='lock'){const falta=a.deps.filter(d=>!feita(f.t[d])).map(d=>A(d).n.toLowerCase());info+=`<div class="lockmsg">${LOCK_SVG} disponível após a conclusão de ${falta.join(' e ')}</div>`}
  if(a.k==='hor'&&f.base)info+=f.base.tot?(f.base.des?`<small class="basenote bad">base: ${f.base.des} de ${f.base.tot} desatualizados</small>`:`<small class="basenote good">base: todos atualizados</small>`):'<small>frota não localizada na base</small>';
  const steps=a.steps.map((s,j)=>{const v=t.st[j],on=v!==null,nx=j===i;
    let sd='';
    if(on&&v){const d=dias(v);sd=d===0?'hoje':d===1?'ontem':fmt(v)}
    if(s.mail&&on)sd=`<label class="prazo">Enviado em <input type="date" value="${esc(v||'')}" data-envio="${f.id}" data-k="${a.k}" aria-label="Data de envio do e-mail"></label>`;
    if(!s.eu&&j>0&&t.st[0]!==null){const d=t.prazo?dias(t.prazo):null, venc=!on&&d!==null&&d>0;
      sd=`${on&&v?`<span>concluído em ${fmt(v)}</span>`:''}<label class="prazo ${venc?'late':''}">Prazo <input type="date" value="${esc(t.prazo)}" data-prazo="${f.id}" data-k="${a.k}" aria-label="Prazo dado ao responsável"></label>${venc?`<span class="late-txt">vencido há ${d} dia${d===1?'':'s'}</span>`:''}`}
    return `<div class="step ${on?'on':''} ${nx?'next':''} ${s.eu?'':'outro'}"><button class="dotbtn" type="button" data-act="passo" data-fid="${f.id}" data-k="${a.k}" data-i="${j}" aria-label="${esc(s.n)}${on?' (registrado; clicar para desfazer)':''}">
      <span class="dot">${on?'✓':j+1}</span><span class="sl">${esc(s.n)}</span></button><span class="sd">${sd}</span></div>`}).join('');
  const tipo=tipoEmail(f,a);
  return `<div class="row ${e==='lock'?'lock':''} ${t.na?'na':''} ${e==='ok'?'done':''}">
    <div class="an">${a.n}<span class="tag ${q[1]}">${q[0]}</span>${t.na?'<small>não se aplica</small>':info}</div>
    <div class="steps">${steps}</div>
    <div class="right">${tipo&&!t.na?`<button class="lnk" type="button" data-act="mail" data-fid="${f.id}" data-k="${a.k}">${tipo==='reforco'?'reforço do site':'e-mail do site'}</button>`:''}
    <button class="nabtn" type="button" data-act="na" data-fid="${f.id}" data-k="${a.k}" aria-pressed="${t.na}" title="Não se aplica">N/A</button></div></div>`;
}
const sel={};
function vSite(s){
  const fs=S.frotas.filter(f=>f.cliente===s), c=conta(fs);
  if(!fs.find(f=>f.id===sel[s])){const p=proximo(fs);sel[s]=(p&&p.f.id)||(fs.find(f=>conta([f]).pend)||fs[0]).id}
  const f=fs.find(x=>x.id===sel[s]), k=conta([f]);
  const chips=fs.map(x=>{const kk=conta([x]);const n=!kk.pend?'<span class="n ok">✓</span>':kk.eu?`<span class="n num" title="ações GFC">${kk.eu}</span>`:kk.esp?`<span class="n esp num" title="aguardando">${kk.esp}</span>`:'';
    return `<button class="chip" type="button" data-act="frota" data-site="${esc(s)}" data-fid="${x.id}" aria-pressed="${x.id===f.id}">${esc(x.frota)}${n}</button>`}).join('');
  return `${focoHtml(fs,s)}
   <div class="filtro"><span class="lbl">Frota:</span>${chips}
     <span class="resumo num"><span><i style="background:var(--amarelo)"></i>${c.eu} ${c.eu===1?'ação':'ações'} GFC</span><span><i style="background:var(--azul)"></i>${c.esp} aguardando</span><span><i style="background:#A6A6A6"></i>${c.lock} bloqueadas</span><span><i style="background:var(--verde)"></i>${c.ok}/${c.tot} concluídas</span></span></div>
   <section class="fr"><div class="fr-h"><h3>${esc(f.frota)}</h3><span class="who">Consultor: <b>${esc(f.resp||'—')}</b></span><span class="who">CSP: <b>${esc(f.csp||'definir em Ajustes')}</b></span><span class="c num">${k.ok} de ${k.tot} concluídas</span></div>
   ${ATV.map(a=>linha(f,a)).join('')}</section>
   <div class="fluxo" style="margin:10px 0 0">Sequência do mês: <span class="p">Horímetro + Histórico de trocas</span>→<span class="p">ROM</span>→<span class="p">Vida útil + Forecast</span></div>`;
}
function vAjustes(){
  return `<div class="box2"><h3>Mês e responsável</h3><p>Mês de referência do controle e nome do responsável exibido na barra lateral.</p>
    <div class="row-acts"><input type="month" value="${esc(S.mes)}" data-set="mes"><input class="in" type="text" value="${esc(S.cfg.responsavel)}" data-set="responsavel" aria-label="Responsável">
    <button class="btn am" type="button" data-act="fechar">Fechar o mês e iniciar o próximo</button></div></div>
   <div class="box2"><h3>Backup no Excel</h3><p>Os dados ficam salvos neste navegador. Recomenda-se exportar periodicamente. Para restaurar, importar o arquivo exportado ou a planilha de controle anterior.</p>
    <div class="row-acts"><button class="btn" type="button" data-act="exportar">Exportar Excel</button><button class="btn" type="button" data-act="importar">Importar Excel</button></div></div>
   <div class="box2"><h3>Prazo padrão</h3><p>Prazo, em dias, definido automaticamente ao registrar o envio do e-mail. O prazo de cada atividade pode ser alterado na própria linha.</p>
    <div class="row-acts"><input type="number" min="1" max="31" value="${S.cfg.dias}" data-set="dias" style="width:80px"> dias</div></div>
   <div class="box2"><h3>Frotas</h3><p>Cada cliente corresponde a um site na barra lateral. Os e-mails são consolidados por site: o CSP de cada frota é mencionado nos e-mails de horímetro, vida útil e forecast, e o consultor no de histórico de trocas (exceto frotas 794).</p>
    <div class="tw"><table><thead><tr><th>Cliente (site)</th><th>Frota</th><th>Consultor</th><th>CSP</th><th>Cliente na base</th><th>Modelos</th><th></th></tr></thead><tbody>
    ${S.frotas.map(f=>`<tr><td><input value="${esc(f.cliente)}" data-fid="${f.id}" data-f="cliente"></td><td><input value="${esc(f.frota)}" data-fid="${f.id}" data-f="frota"></td><td><input value="${esc(f.resp)}" data-fid="${f.id}" data-f="resp"></td><td><input value="${esc(f.csp)}" data-fid="${f.id}" data-f="csp" placeholder="nome do CSP"></td><td><input value="${esc(f.baseCliente)}" data-fid="${f.id}" data-f="baseCliente"></td><td><input value="${esc(f.modelos.join(', '))}" data-fid="${f.id}" data-f="modelos"></td><td><button class="lnk" type="button" data-act="rm" data-fid="${f.id}">remover</button></td></tr>`).join('')}
    </tbody></table></div><div class="row-acts" style="margin-top:10px"><button class="btn" type="button" data-act="add">Adicionar frota</button></div></div>`;
}

/* ---------- Excel ---------- */
function ler(file){return new Promise((res,rej)=>{if(typeof XLSX==='undefined'){rej(new Error('Sem internet: o leitor de Excel não carregou.'));return}const r=new FileReader();r.onload=()=>{try{res(XLSX.read(new Uint8Array(r.result),{type:'array'}))}catch(e){rej(new Error('Arquivo inválido.'))}};r.onerror=()=>rej(new Error('Não consegui ler o arquivo.'));r.readAsArrayBuffer(file)})}
function baixar(wb,nome){const b=new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})]);const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}
function linhasMes(){const out=[];S.frotas.forEach(f=>ATV.forEach(a=>{const t=f.t[a.k];out.push({data:t.st[0]||'',cli:f.cliente,frota:f.frota,resp:f.resp,atv:a.n,sit:sitHist(f,a),receb:t.na?'NA':(a.steps.length>1&&t.st[1]!==null)||feita(t)?'Sim':'Não',sis:t.na?'NA':feita(t)?'Sim':'Não',orig:'',origem:'Fechamento'})}));return out}
function exportar(){
  if(typeof XLSX==='undefined'){toast('Sem internet: não consigo gerar o Excel agora.');return}
  const wb=XLSX.utils.book_new(), v=x=>x===null?'':(x||'Sim');
  const t=[['CLIENTE','FROTA','CONSULTOR','CSP','ATIVIDADE','NÃO SE APLICA','ETAPA 1','ETAPA 2','ETAPA 3','CLIENTE NA BASE','MODELOS','MÊS','PRAZO']];
  S.frotas.forEach(f=>ATV.forEach(a=>{const x=f.t[a.k];t.push([f.cliente,f.frota,f.resp,f.csp,a.n,x.na?'Sim':'',...[0,1,2].map(j=>j<a.steps.length?v(x.st[j]):''),f.baseCliente,f.modelos.join(', '),S.mes,x.prazo?fmt(x.prazo):''])}));
  const ws=XLSX.utils.aoa_to_sheet(t);XLSX.utils.book_append_sheet(wb,ws,'TAREFAS');
  const leg=[['ATIVIDADE','ETAPA 1','ETAPA 2','ETAPA 3']];ATV.forEach(a=>leg.push([a.n,...a.steps.map(s=>s.n)]));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(leg),'ETAPAS');
  const h=[['MÊS','DATA DA COBRANÇA','CLIENTE','FROTA','RESPONSÁVEL','ATIVIDADE','SITUAÇÃO','RECEBIDO DO RESP.','ATUALIZADO NO SISTEMA','STATUS ORIGINAL','ORIGEM']];
  Object.keys(H).sort().forEach(m=>H[m].forEach(l=>h.push([m,fmt(l.data),l.cli,l.frota,l.resp,l.atv,l.sit,l.receb,l.sis,l.orig,l.origem])));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(h),'HISTORICO');
  baixar(wb,`TAREFAS_GFC_${S.mes}.xlsx`);toast('Arquivo Excel exportado para a pasta de Downloads.');
}
const serial=v=>{if(v===''||v==null)return null;if(typeof v==='number')return new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5).toISOString().slice(0,10);const s=String(v).trim();if(norm(s)==='SIM')return '';let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:null};
async function importar(file){
  try{
    const wb=await ler(file);let frotas=null,mes=S.mes;
    const ws=wb.Sheets['TAREFAS'];
    if(ws){
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});const hd=rows[0].map(norm);rows.shift();
      const novo=hd.includes('ETAPA 1'), mp=new Map();
      rows.filter(r=>r[0]).forEach(r=>{
        const key=r[0]+'|'+r[1];
        if(!mp.has(key))mp.set(key,{id:uid(),cliente:String(r[0]),frota:String(r[1]),resp:String(r[2]),csp:novo?String(r[3]):'',baseCliente:'',modelos:[],t:vazioT(),base:null});
        const f=mp.get(key);
        if(novo){const a=ATV.find(x=>x.n===String(r[4]));if(!a)return;const ip=hd.indexOf('PRAZO');f.t[a.k]={na:norm(r[5])==='SIM',st:a.steps.map((_,j)=>serial(r[6+j])),prazo:ip>=0?(serial(r[ip])||''):''};f._v3=f._v3||(hd.includes('PRAZO')?0:1);f.baseCliente=String(r[9]||'');f.modelos=String(r[10]||'').split(',').map(nm).filter(Boolean);if(r[11])mes=String(r[11])}
        else{const nomes={'Mapa de Componentes':'mapa','Horímetro':'hor','ROM':'rom','Vida Útil':'vida','Forecast':'fc'};const k=nomes[String(r[3])];if(!k)return;
          f._v2=f._v2||{};f._v2[k]={na:norm(r[4])==='SIM',e:serial(r[5]),r:serial(r[6]),s:serial(r[7])};f.baseCliente=String(r[8]||'');f.modelos=String(r[9]||'').split(',').map(nm).filter(Boolean);if(r[10])mes=String(r[10])}
      });
      frotas=[...mp.values()].map(f=>{if(f._v2){f.t=deV2(f._v2);delete f._v2}if(f._v3){f.t=deV3(f.t)}delete f._v3;return f});
    }else if(wb.Sheets['CONTROLE']){
      const aoa=XLSX.utils.sheet_to_json(wb.Sheets['CONTROLE'],{header:1,raw:true,defval:''});
      (aoa[1]||[]).forEach(c=>{if(/^\d{4}-\d{2}$/.test(String(c).trim()))mes=String(c).trim()});
      const dc=serial((aoa[1]||[]).find(c=>typeof c==='number'&&c>30000))||hoje();
      const hi=aoa.findIndex(r=>norm(r[0])==='CLIENTE'&&norm(r[1])==='FROTA');
      if(hi<0)throw new Error('Não achei o cabeçalho CLIENTE / FROTA.');
      frotas=[];
      for(let i=hi+1;i<aoa.length;i++){const r=aoa[i];if(!String(r[0]).trim()||norm(r[0]).startsWith('COMO'))break;
        const Y=x=>norm(x)==='SIM',N=x=>norm(x)==='NA';
        const t2={mapa:{na:N(r[4])||N(r[5]),e:(Y(r[3])||Y(r[4])||Y(r[5]))?dc:null,r:(Y(r[4])||Y(r[5]))?'':null,s:Y(r[5])?'':null},
                  hor:{na:N(r[7])||N(r[8]),e:(Y(r[6])||Y(r[7])||Y(r[8]))?dc:null,r:(Y(r[7])||Y(r[8]))?'':null,s:Y(r[8])?'':null},
                  rom:{na:N(r[9])||N(r[10]),e:null,r:null,s:Y(r[10])?'':null},
                  vida:{na:N(r[11]),e:null,r:null,s:Y(r[11])?'':null},fc:{na:N(r[12]),e:null,r:null,s:Y(r[12])?'':null}};
        const ant=S.frotas.find(f=>norm(f.cliente)===norm(r[0])&&norm(f.frota)===norm(r[1]));
        frotas.push({id:uid(),cliente:String(r[0]).trim(),frota:String(r[1]).trim(),resp:String(r[2]).trim(),csp:ant?ant.csp:'',baseCliente:ant?ant.baseCliente:'',modelos:ant?ant.modelos:String(r[1]).split(/,|\se\s/).map(nm).filter(Boolean),t:deV2(t2),base:null})}
    }else throw new Error('Não achei as abas TAREFAS ou CONTROLE nesse arquivo.');
    if(!frotas.length)throw new Error('Nenhuma frota encontrada no arquivo.');
    if(!confirm(`Substituir o controle atual pelas ${frotas.length} frotas do arquivo?`))return;
    S.frotas=frotas;S.mes=mes;S.v=4;normalizar(S);
    const wh=wb.Sheets['HISTORICO'];
    if(wh){const hm={};XLSX.utils.sheet_to_json(wh,{header:1,raw:true,defval:''}).forEach(r=>{const m=String(r[0]).trim();if(!/^\d{4}-\d{2}$/.test(m))return;(hm[m]=hm[m]||[]).push({data:serial(r[1])||'',cli:String(r[2]),frota:String(r[3]),resp:String(r[4]),atv:String(r[5]),sit:String(r[6]),receb:String(r[7]),sis:String(r[8]),orig:String(r[9]),origem:String(r[10])})});Object.assign(H,hm)}
    salvar();aba='geral';render();toast(`Importado: ${frotas.length} frotas.`);
  }catch(e){toast(e.message)}
}
async function importarBase(file){
  try{
    const wb=await ler(file);const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
    const hi=aoa.findIndex(r=>norm(r[0])==='CLIENTE'&&r.some(c=>norm(c)==='STATUS DO HORIMETRO'));
    if(hi<0)throw new Error('Esse arquivo não parece o Relatório de Equipamentos (falta "Status do Horímetro").');
    const Hd=aoa[hi].map(norm),c=n=>Hd.indexOf(norm(n));
    const C={cli:c('Cliente'),mod:c('Modelo'),sh:c('Status do Horímetro'),est:c('Estado')};
    const rows=aoa.slice(hi+1).filter(r=>r[C.cli]).map(r=>({cli:String(r[C.cli]).trim(),mod:nm(r[C.mod]),sh:String(r[C.sh]).trim(),est:String(r[C.est]).trim()}));
    const clientes=[...new Set(rows.map(r=>r.cli))];let concl=0,pend=0;
    S.frotas.forEach(f=>{
      if(!f.baseCliente){const k=CLI_KEY[norm(f.cliente)];const hit=k&&clientes.find(x=>norm(x).includes(norm(k)));if(hit)f.baseCliente=hit}
      const el=rows.filter(r=>norm(r.cli)===norm(f.baseCliente)&&f.modelos.includes(r.mod)&&r.est!=='Descartado'&&r.est!=='Hibernado');
      const des=el.filter(r=>/^desatualizado/i.test(r.sh)).length;f.base={tot:el.length,des};
      const t=f.t.hor;if(!el.length||t.na)return;
      if(!des){if(!feita(t)){t.st=t.st.map(x=>x===null?hoje():x);concl++}}
      else{if(t.st[1]!==null)t.st[1]=null;pend++}
    });
    salvar();render();toast(`Relatório processado. ${concl} horímetro${concl===1?'':'s'} registrado${concl===1?'':'s'} como concluído${concl===1?'':'s'}; ${pend} frota${pend===1?'':'s'} com equipamentos desatualizados.`);
  }catch(e){toast(e.message)}
}
function proxMes(m){const [y,mm]=m.split('-').map(Number);const d=new Date(y,mm,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function fecharMes(){
  const c=conta(S.frotas);
  if(!confirm(`Fechar ${mesNome(S.mes)} com ${c.p}% concluído?\n\nO mês vai para o histórico${H[S.mes]?' (substituindo o fechamento anterior)':''} e ${mesNome(proxMes(S.mes))} começa zerado. Os "N/A" continuam marcados.`))return;
  H[S.mes]=linhasMes();const m=S.mes;S.mes=proxMes(m);
  S.frotas.forEach(f=>{ATV.forEach(a=>{f.t[a.k]={st:a.steps.map(()=>null),na:f.t[a.k].na,prazo:''}});f.base=null});
  salvar();aba='geral';render();toast(`${mesNome(m)} fechado e registrado no histórico. Controle de ${mesNome(S.mes)} iniciado.`);
}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act],[data-aba]');if(!b)return;
  if(b.dataset.aba){aba=b.dataset.aba;render();window.scrollTo({top:0});return}
  const a=b.dataset.act,fid=b.dataset.fid;
  if(a==='frota'){sel[b.dataset.site]=fid;render();return}
  if(a==='passo'){if(b.closest('.foco')&&aba!=='geral')sel[aba]=fid;return marcar_(fid,b.dataset.k,+b.dataset.i)}
  if(a==='na')return toggleNA(fid,b.dataset.k);
  if(a==='mail')return copiarEmail(fid,b.dataset.k);
  if(a==='undo')return desfazer();
  if(a==='toastFn'){hideToast();tFn&&tFn();return}
  if(a==='base')return $('#fBase').click();
  if(a==='importar')return $('#fImp').click();
  if(a==='exportar')return exportar();
  if(a==='fechar')return fecharMes();
  if(a==='fechaDlg')return $('#dlg').close();
  if(a==='add'){S.frotas.push({id:uid(),cliente:'Novo site',frota:'',resp:'',csp:'',modelos:[],baseCliente:'',t:vazioT(),base:null});salvar();render();return}
  if(a==='rm'){const f=S.frotas.find(x=>x.id===fid);if(confirm(`Remover ${f.cliente} · ${f.frota}?`)){S.frotas=S.frotas.filter(x=>x.id!==fid);salvar();render()}return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='fBase'&&t.files[0]){importarBase(t.files[0]);t.value='';return}
  if(t.id==='fImp'&&t.files[0]){importar(t.files[0]);t.value='';return}
  if(t.dataset.envio){const f=S.frotas.find(x=>x.id===t.dataset.envio);if(f){const tt=f.t[t.dataset.k];tt.st[0]=t.value||'';if(t.value&&!tt.prazo)tt.prazo=somaDias(t.value,S.cfg.dias);salvar();render();toast('Data de envio do e-mail atualizada.')}return}
  if(t.dataset.prazo){const f=S.frotas.find(x=>x.id===t.dataset.prazo);if(f){f.t[t.dataset.k].prazo=t.value;salvar();render();toast('Prazo atualizado.')}return}
  if(t.dataset.set==='mes'&&t.value){S.mes=t.value;salvar();render();return}
  if(t.dataset.set==='responsavel'){S.cfg.responsavel=t.value.trim()||'Vitoria';salvar();render();return}
  if(t.dataset.set==='dias'){S.cfg.dias=Math.max(1,parseInt(t.value)||5);salvar();render();return}
  if(t.dataset.f){const f=S.frotas.find(x=>x.id===t.dataset.fid);if(!f)return;f[t.dataset.f]=t.dataset.f==='modelos'?t.value.split(',').map(nm).filter(Boolean):t.value.trim();salvar();render()}
});

carregar();render();
