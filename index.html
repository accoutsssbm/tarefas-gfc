<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tarefas GFC</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#F5F6F8; --card:#FFFFFF; --ink:#15171A; --muted:#6B7280; --line:#E3E6EA;
  --y:#FFCD11; --y-soft:#FFF6CC; --y-dark:#C79A00;
  --ok:#2E9E5B; --ok-soft:#E3F4EA; --late:#D7263D; --late-soft:#FCE6E9;
  --font:"Segoe UI","Segoe UI Variable",Arial,system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--y-dark);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* topo */
.top{background:#fff;border-bottom:4px solid var(--y)}
.top-in{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{margin:0;font-size:20px;font-weight:800}
.top .mes{color:var(--muted);font-size:15px}
.top .sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:14.5px}
.btn:hover{border-color:var(--ink)}
.btn.y{background:var(--y);border-color:var(--y-dark)}
.btn.sm{padding:5px 10px;font-size:13.5px}
.btn.link{border:0;background:none;text-decoration:underline;color:var(--muted);padding:4px}

/* abas */
.tabs{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.tabs-in{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:0 4px;padding:0 12px}
@media (max-width:720px){.tabs-in{flex-wrap:nowrap;overflow-x:auto}}
.tab{border:0;background:none;padding:14px 14px 11px;border-bottom:4px solid transparent;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px;font-size:15px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--y)}
.badge{min-width:22px;height:22px;border-radius:11px;background:var(--y);color:var(--ink);font-size:12.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.badge.done{background:var(--ok);color:#fff}

main{max-width:1100px;margin:0 auto;padding:22px 20px 80px}

/* visão geral */
.hello{font-size:22px;font-weight:800;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.tile:hover{border-color:var(--ink)}
.tile .nm{font-weight:800;font-size:17px}
.tile .pc{font-size:34px;font-weight:800;line-height:1}
.tile .st{font-size:14px;color:var(--muted)}
.tile.done{background:var(--ok-soft);border-color:var(--ok)}
.tile.done .st{color:var(--ok);font-weight:700}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}

/* foco */
.focus{background:var(--y-soft);border:2px solid var(--y);border-radius:14px;padding:16px 18px;margin-bottom:18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.focus .lbl{font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--y-dark)}
.focus .txt{font-size:18px;font-weight:700;flex:1;min-width:220px}
.focus.done{background:var(--ok-soft);border-color:var(--ok)}
.focus.done .lbl{color:var(--ok)}
.site-h{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.site-h h2{margin:0;font-size:26px;font-weight:800}
.site-h .prog{flex:1;min-width:160px;max-width:320px}
.site-h .prog small{color:var(--muted)}
.chk{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14.5px;cursor:pointer}
.chk input{width:18px;height:18px}

/* cards de frota */
.frotas{display:flex;flex-direction:column;gap:14px}
.fr{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.fr-h{display:flex;align-items:center;gap:12px;padding:14px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.fr-h h3{margin:0;font-size:20px;font-weight:800}
.fr-h .who{color:var(--muted);font-size:14.5px}
.fr-h .who b{color:var(--ink)}
.fr-h .cnt{margin-left:auto;font-size:14px;color:var(--muted)}
.fr.fechada .fr-h{border-bottom:0;background:var(--ok-soft)}
.fr.fechada h3::before{content:"✓ ";color:var(--ok)}

.row{display:grid;grid-template-columns:190px minmax(0,1fr) auto;gap:10px 14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .an{font-weight:700;font-size:15.5px}
.row .an small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.row.na{opacity:.55}
.row.feita .an{color:var(--muted)}

.steps{display:flex;align-items:flex-start}
.step{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;background:none;border:0;cursor:pointer;padding:0 4px;min-width:0}
.step::before{content:"";position:absolute;top:17px;right:50%;width:100%;height:3px;background:var(--line);z-index:0}
.step:first-child::before{display:none}
.step.on::before{background:var(--ok)}
.dot{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;position:relative;z-index:1;color:var(--muted)}
.step.on .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.step.next .dot{background:var(--y);border-color:var(--ink);color:var(--ink);box-shadow:0 0 0 4px var(--y-soft)}
.step .sl{font-size:13px;font-weight:600;color:var(--muted);text-align:center;line-height:1.2}
.step.next .sl{color:var(--ink);font-weight:800}
.step.on .sl{color:var(--ink)}
.step .sd{font-size:12px;color:var(--muted);text-align:center}
.step .sd.late{color:var(--late);font-weight:700}
.step:hover .dot{border-color:var(--ink)}
.row.na .step{pointer-events:none}
.nabtn{border:1px solid var(--line);background:#fff;border-radius:8px;font-size:12.5px;padding:5px 8px;color:var(--muted);cursor:pointer}
.nabtn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.basenote{font-size:12.5px;font-weight:700}
.basenote.bad{color:var(--late)}
.basenote.good{color:var(--ok)}
.hidden-rows{padding:8px 16px 12px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}
@media (max-width:720px){
  .row{grid-template-columns:1fr auto}
  .row .steps{grid-column:1/-1;order:3}
  .step .sl{font-size:12px}
}

/* ajustes */
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.box h2{margin:0 0 4px;font-size:18px}
.box p{margin:0 0 12px;color:var(--muted);font-size:14.5px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12.5px;color:var(--muted);font-weight:700;box-shadow:inset 0 -2px 0 var(--y)}
td input{width:100%;min-width:90px;border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-size:14px}
input[type=month],input[type=number]{border:1px solid var(--line);border-radius:8px;padding:6px 8px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;border:1px solid var(--line);border-left:5px solid var(--y);border-radius:12px;padding:12px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 28px rgba(0,0,0,.14);max-width:92vw;z-index:20;font-size:15px}
.toast button{border:0;background:none;font-weight:800;text-decoration:underline;cursor:pointer}
.hidden{display:none!important}
dialog{border:1px solid var(--line);border-radius:14px;padding:18px;width:min(560px,92vw)}
dialog::backdrop{background:rgba(20,22,26,.35)}
dialog textarea{width:100%;min-height:220px;border:1px solid var(--line);border-radius:8px;padding:10px;font:14px/1.4 var(--font)}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <h1>Tarefas GFC</h1><span class="mes" id="mes"></span><span class="sp"></span>
  <button class="btn" type="button" data-act="base">Atualizar horímetro pela base</button>
</div></header>
<nav class="tabs"><div class="tabs-in" id="tabs" role="tablist"></div></nav>
<main id="main"></main>
<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>
<input type="file" id="fBase" accept=".xlsx,.xls" class="hidden">
<input type="file" id="fImp" accept=".xlsx,.xls" class="hidden">

", "cli": "S11D", "frota": "994k", "resp": "", "atv": "Vida Útil", "sit": "NA", "receb": "", "sis": "", "orig": "Sem substituições", "origem": "Importado"}, {"data": "", "cli": "S11D", "frota": "994k", "resp": "", "atv": "Forecast", "sit": "NA", "receb": "", "sis": "", "orig": "Sem substituições", "origem": "Importado"}, {"data": "", "cli": "S11D", "frota": "D11 e D11T", "resp": "", "atv": "Mapa de Componentes", "sit": "NA", "receb": "", "sis": "", "orig": "Sem substituições", "origem": "Importado"}, {"data": "2026-01-21", "cli": "S11D", "frota": "D11 e D11T", "resp": "", "atv": "Horímetro", "sit": "COBRAR", "receb": "", "sis": "", "orig": "Solicitado", "origem": "Importado"}, {"data": "", "cli": "S11D", "frota": "D11 e D11T", "resp": "", "atv": "Vida Útil", "sit": "NA", "receb": "", "sis": "", "orig": "Sem substituições", "origem": "Importado"}, {"data": "", "cli": "S11D", "frota": "D11 e D11T", "resp": "", "atv": "Forecast", "sit": "COBRAR", "receb": "", "sis": "", "orig": "Solicitado", "origem": "Importado"}, {"data": "", "cli": "Salobo", "frota": "24", "resp": "", "atv": "Mapa de Componentes", "sit": "OK", "receb": "", "sis": "", "orig": "Atualizado", "origem": "Importado"}, {"data": "2026-01-21", "cli": "Salobo", "frota": "24", "resp": "", "atv": "Horímetro", "sit": "COBRAR", "receb": "", "sis": "", "orig": "Solicitado", "origem": "Importado"}, {"data": "", "cli": "Salobo", "frota": "24", "resp": "", "atv": "Vida Útil", "sit": "NA", "receb": "", "sis": "", "orig": "Sem substituições", "origem": "Importado"}, {"data": "", "cli": "Salobo", "frota": "24", "resp": "", "atv": "Forecast", "sit": "NA", "receb": "", "sis": "", "orig": "Sem substituições", "origem": "Importado"}, {"data": "", "cli": "Salobo", "frota": "794AC", "resp": "", "atv": "Mapa de Componentes", "sit": "COBRAR", "receb": "", "sis": "", "orig": "Solicitado", "origem": "Importado"}, {"data": "2026-01-21", "cli": "Salobo", "frota": "794AC", "resp": "", "atv": "Horímetro", "sit": "COBRAR", "receb": "", "sis": "", "orig": "Solicitado", "origem": "Importado"}, {"data": "", "cli": "Salobo", "frota": "794AC", "resp": "", "atv": "Vida Útil", "sit": "NA", "receb": "", "sis": "", "orig": "Sem substituições", "origem": "Importado"}, {"data": "", "cli": "Salobo", "frota": "794AC", "resp": "", "atv": "Forecast", "sit": "NA", "receb": "", "sis": "", "orig": "Sem substituições", "origem": "Importado"}, {"data": "", "cli": "Salobo", "frota": "797F", "resp": "", "atv": "Mapa de Componentes", "sit": "OK", "receb": "", "sis": "", "orig": "Atualizado", "origem": "Importado"}, {"data": "2026-01-21", "cli": "Salobo", "frota": "797F", "resp": "", "atv": "Horímetro", "sit": "COBRAR", "receb": "", "sis": "", "orig": "Solicitado", "origem": "Importado"}, {"data": "", "cli": "Salobo", "frota": "797F", "resp": "", "atv": "Vida Útil", "sit": "NA", "receb": "", "sis": "", "orig": "Sem substituições", "origem": "Importado"}, {"data": "", "cli": "Salobo", "frota": "797F", "resp": "", "atv": "Forecast", "sit": "NA", "receb": "", "sis": "", "orig": "Sem substituições", "origem": "Importado"}, {"data": "", "cli": "Salobo", "frota": "D11 e D11T", "resp": "", "atv": "Mapa de Componentes", "sit": "OK", "receb": "", "sis": "", "orig": "Atualizado", "origem": "Importado"}, {"data": "2026-01-21", "cli": "Salobo", "frota": "D11 e D11T", "resp": "", "atv": "Horímetro", "sit": "COBRAR", "receb": "", "sis": "", "orig": "Solicitado", "origem": "Importado"}, {"data": "", "cli": "Salobo", "frota": "D11 e D11T", "resp": "", "atv": "Vida Útil", "sit": "NA", "receb": "", "sis": "", "orig": "Sem substituições", "origem": "Importado"}, {"data": "", "cli": "Salobo", "frota": "D11 e D11T", "resp": "", "atv": "Forecast", "sit": "COBRAR", "receb": "", "sis": "", "orig": "Solicitado", "origem": "Importado"}, {"data": "", "cli": "Sossego", "frota": "793D", "resp": "", "atv": "Mapa de Componentes", "sit": "OK", "receb": "", "sis": "", "orig": "Atualizado", "origem": "Importado"}, {"data": "2026-01-21", "cli": "Sossego", "frota": "793D", "resp": "", "atv": "Horímetro", "sit": "COBRAR", "receb": "", "sis": "", "orig": "Solicitado", "origem": "Importado"}, {"data": "", "cli": "Sossego", "frota": "793D", "resp": "", "atv": "Vida Útil", "sit": "NA", "receb": "", "sis": "", "orig": "Sem substituições", "origem": "Importado"}, {"data": "", "cli": "Sossego", "frota": "793D", "resp": "", "atv": "Forecast", "sit": "COBRAR", "receb": "", "sis": "", "orig": "Solicitado", "origem": "Importado"}, {"data": "", "cli": "Sossego", "frota": "D11T", "resp": "", "atv": "Mapa de Componentes", "sit": "NA", "receb": "", "sis": "", "orig": "Sem substituições", "origem": "Importado"}, {"data": "2026-01-21", "cli": "Sossego", "frota": "D11T", "resp": "", "atv": "Horímetro", "sit": "COBRAR", "receb": "", "sis": "", "orig": "Solicitado", "origem": "Importado"}, {"data": "", "cli": "Sossego", "frota": "D11T", "resp": "", "atv": "Vida Útil", "sit": "NA", "receb": "", "sis": "", "orig": "Sem substituições", "origem": "Importado"}, {"data": "", "cli": "Sossego", "frota": "D11T", "resp": "", "atv": "Forecast", "sit": "COBRAR", "receb": "", "sis": "", "orig": "Solicitado", "origem": "Importado"}]}}</script>
<script>
const ATV=[{k:'mapa',n:'Mapa de Componentes'},{k:'hor',n:'Horímetro'},{k:'rom',n:'ROM'},{k:'vida',n:'Vida Útil'},{k:'fc',n:'Forecast'}];
const PASSOS=[{c:'e',n:'E-mail enviado'},{c:'r',n:'Resposta recebida'},{c:'s',n:'Concluído no sistema'}];
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const CLI_KEY={CARAJAS:'CARAJ',S11D:'S11D',SALOBO:'(SALOBO)',SOSSEGO:'(SOSSEGO)',HYDRO:'PARAGOMINAS',MRN:'RIO DO NORTE',ALCOA:'ALCOA',BRAZAURO:'BRAZAURO','ONCA PUMA':'ONCA PUMA'};
const LS='tarefas-gfc-v2';
let S=null, H={}, aba='geral', undo=null;

const $=q=>document.querySelector(q);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();
const nm=s=>String(s??'').toUpperCase().replace(/\s+/g,'');
const clone=o=>JSON.parse(JSON.stringify(o));
const hoje=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const dias=iso=>{if(!iso)return null;const [y,m,d]=iso.split('-').map(Number);const t=new Date();t.setHours(0,0,0,0);return Math.round((t-new Date(y,m-1,d))/864e5)};
const fmt=iso=>iso?iso.split('-').reverse().join('/'):'';
const mesNome=m=>{const [y,mm]=m.split('-');return MESES[+mm-1]+' '+y};
const uid=()=>'f'+Math.random().toString(36).slice(2,9);
const vazioT=()=>Object.fromEntries(ATV.map(a=>[a.k,{e:null,r:null,s:null,na:false}]));

function salvar(){try{localStorage.setItem(LS,JSON.stringify({S,H}))}catch(e){toast('Não consegui salvar neste navegador. Exporte o Excel para não perder.')}}
function carregar(){
  try{const c=JSON.parse(localStorage.getItem(LS)||'null');if(c&&c.S){S=c.S;H=c.H||{};return}}catch(e){}
  try{const sd=JSON.parse($('#seed').textContent);S=sd.state;H=sd.hist||{}}catch(e){S={v:2,mes:hoje().slice(0,7),cfg:{dias:5,mostrarFeitas:false},frotas:[]}}
  salvar();
}
function sites(){return [...new Set(S.frotas.map(f=>f.cliente))]}

/* ---------- regras ---------- */
function prox(t){if(t.na)return -1;return PASSOS.findIndex(p=>t[p.c]===null)}   // -1 = nada a fazer
function feita(t){return t.na||t.s!==null}
function statsDe(lista){let tot=0,ok=0;lista.forEach(f=>ATV.forEach(a=>{const t=f.t[a.k];if(t.na)return;tot++;if(t.s!==null)ok++}));return {tot,ok,pend:tot-ok,p:tot?Math.round(ok/tot*100):100}}
function situacao(t){if(t.na)return 'NA';if(t.s!==null)return 'OK';if(t.r!==null)return 'EU ATUALIZO';return 'COBRAR'}

/* ---------- ações ---------- */
function clicarPasso(fid,k,i){
  const f=S.frotas.find(x=>x.id===fid), t=f.t[k];
  undo={fid,t:clone(f.t)};
  const a=ATV.find(x=>x.k===k);
  if(t[PASSOS[i].c]!==null){ for(let j=i;j<3;j++)t[PASSOS[j].c]=null; toast(`${a.n} (${f.frota}): voltou para "${PASSOS[i].n}".`,true)}
  else{ for(let j=0;j<=i;j++)if(t[PASSOS[j].c]===null)t[PASSOS[j].c]=hoje();
    toast(i===2?`${a.n} (${f.frota}) concluído. Boa!`:`${a.n} (${f.frota}): ${PASSOS[i].n.toLowerCase()}.`,true)}
  salvar();render();
}
function toggleNA(fid,k){const f=S.frotas.find(x=>x.id===fid);undo={fid,t:clone(f.t)};f.t[k].na=!f.t[k].na;salvar();render()}
function desfazer(){if(!undo)return;const f=S.frotas.find(x=>x.id===undo.fid);if(f)f.t=undo.t;undo=null;salvar();render();hideToast()}

function textoEmail(f){
  const pend=ATV.filter(a=>{const t=f.t[a.k];return !t.na&&t.r===null});
  const nome=String(f.resp).split(' ')[0];
  return {pend,txt:`Olá, ${nome}! Tudo bem?\n\nPara fecharmos o GFC de ${mesNome(S.mes)}, preciso das informações abaixo da frota ${f.frota} (${f.cliente}):\n\n${pend.map(a=>'• '+a.n).join('\n')}\n\nConsegue me enviar assim que possível?\n\nObrigada!`};
}
async function copiarEmail(fid){
  const f=S.frotas.find(x=>x.id===fid);const {pend,txt}=textoEmail(f);
  if(!pend.length){toast('Nada para pedir nessa frota.');return}
  let ok=false;try{await navigator.clipboard.writeText(txt);ok=true}catch(e){}
  if(!ok){$('#dlg').innerHTML=`<p style="margin-top:0"><b>Copie o texto abaixo</b> (Ctrl+C)</p><textarea id="tx">${esc(txt)}</textarea><div class="acts" style="margin-top:10px;justify-content:flex-end"><button class="btn" type="button" data-act="fechaDlg">Fechar</button></div>`;$('#dlg').showModal();$('#tx').select()}
  const semEmail=pend.filter(a=>f.t[a.k].e===null);
  if(semEmail.length)toastAcao('Texto copiado. Já enviou o e-mail?','Sim, marcar como enviado',()=>{undo={fid,t:clone(f.t)};semEmail.forEach(a=>f.t[a.k].e=hoje());salvar();render();toast('E-mail marcado como enviado.',true)});
  else if(ok)toast('Texto copiado.');
}

/* ---------- toast ---------- */
let tT=null,tFn=null;
function toast(m,comUndo){$('#toast').innerHTML=`<span>${esc(m)}</span>${comUndo?'<button type="button" data-act="undo">Desfazer</button>':''}`;$('#toast').classList.remove('hidden');clearTimeout(tT);tT=setTimeout(hideToast,5000)}
function toastAcao(m,b,fn){tFn=fn;$('#toast').innerHTML=`<span>${esc(m)}</span><button type="button" data-act="toastFn">${esc(b)}</button>`;$('#toast').classList.remove('hidden');clearTimeout(tT);tT=setTimeout(hideToast,12000)}
function hideToast(){$('#toast').classList.add('hidden')}

/* ---------- render ---------- */
function render(){
  $('#mes').textContent='· '+mesNome(S.mes);
  const tabs=[['geral','Visão geral',null],...sites().map(s=>[s,s,statsDe(S.frotas.filter(f=>f.cliente===s))]),['ajustes','Ajustes',null]];
  if(aba!=='geral'&&aba!=='ajustes'&&!sites().includes(aba))aba='geral';
  $('#tabs').innerHTML=tabs.map(([k,t,st])=>`<button class="tab" role="tab" type="button" data-aba="${esc(k)}" aria-selected="${aba===k}">${esc(t)}${st?(st.pend?`<span class="badge num">${st.pend}</span>`:'<span class="badge done">✓</span>'):''}</button>`).join('');
  $('#main').innerHTML=aba==='geral'?vGeral():aba==='ajustes'?vAjustes():vSite(aba);
}
function vGeral(){
  const g=statsDe(S.frotas);
  return `<p class="hello">${g.pend?`Faltam ${g.pend} tarefas em ${mesNome(S.mes)}`:'Tudo concluído este mês!'}</p>
  <p class="sub">Escolha um site para começar. ${g.ok} de ${g.tot} tarefas prontas (${g.p}%).</p>
  <div class="tiles">${sites().map(s=>{const st=statsDe(S.frotas.filter(f=>f.cliente===s));
    return `<button class="tile ${st.pend?'':'done'}" type="button" data-aba="${esc(s)}"><span class="nm">${esc(s)}</span><span class="pc num">${st.p}%</span><div class="bar"><i style="width:${st.p}%"></i></div><span class="st num">${st.pend?`${st.pend} tarefa${st.pend>1?'s':''} pendente${st.pend>1?'s':''}`:'✓ Site concluído'}</span></button>`}).join('')}</div>`;
}
function focoDoSite(fs){
  // 1) algo sem e-mail
  for(const f of fs){const l=ATV.filter(a=>prox(f.t[a.k])===0);if(l.length)return {txt:`Enviar e-mail para ${f.resp} pedindo ${l.map(a=>a.n).join(', ')} da ${f.frota}.`,btn:`<button class="btn y" type="button" data-act="email" data-fid="${f.id}">Copiar texto do e-mail</button>`}}
  // 2) resposta atrasada
  let pior=null;fs.forEach(f=>ATV.forEach(a=>{const t=f.t[a.k];if(prox(t)===1){const d=dias(t.e);if(d!==null&&(!pior||d>pior.d))pior={f,a,d}}}));
  if(pior&&pior.d>=S.cfg.dias)return {txt:`Reforçar com ${pior.f.resp}: ${pior.a.n} da ${pior.f.frota} está sem resposta há ${pior.d} dias.`,btn:`<button class="btn y" type="button" data-act="email" data-fid="${pior.f.id}">Copiar texto do e-mail</button>`};
  // 3) concluir no sistema
  for(const f of fs){const l=ATV.filter(a=>prox(f.t[a.k])===2);if(l.length)return {txt:`Concluir no sistema: ${l.map(a=>a.n).join(', ')} da ${f.frota}.`,btn:''}}
  if(pior)return {txt:`Só falta esperar respostas. A mais antiga é de ${pior.f.resp} (${pior.f.frota}), há ${pior.d} dia${pior.d===1?'':'s'}.`,btn:''};
  return null;
}
function vSite(s){
  const fs=S.frotas.filter(f=>f.cliente===s), st=statsDe(fs), foco=focoDoSite(fs), mostrar=S.cfg.mostrarFeitas;
  const cards=fs.map(f=>{
    const fst=statsDe([f]);
    if(!fst.pend&&!mostrar)return `<section class="fr fechada"><div class="fr-h"><h3>${esc(f.frota)}</h3><span class="who">${esc(f.resp)}</span><span class="cnt">tudo pronto</span></div></section>`;
    const linhas=ATV.map(a=>{const t=f.t[a.k];if(!mostrar&&feita(t))return '';return linha(f,a,t)}).join('');
    const escondidas=ATV.filter(a=>feita(f.t[a.k])).length;
    return `<section class="fr"><div class="fr-h"><h3>${esc(f.frota)}</h3><span class="who">Responsável: <b>${esc(f.resp)}</b></span>
      <span class="cnt num">${fst.ok} de ${fst.tot} prontas</span>
      <button class="btn sm" type="button" data-act="email" data-fid="${f.id}">Copiar e-mail</button></div>
      ${linhas}${!mostrar&&escondidas?`<div class="hidden-rows">${escondidas} atividade${escondidas>1?'s':''} já resolvida${escondidas>1?'s':''} (escondida${escondidas>1?'s':''})</div>`:''}</section>`}).join('');
  return `<div class="site-h"><h2>${esc(s)}</h2>
     <div class="prog"><div class="bar"><i style="width:${st.p}%"></i></div><small class="num">${st.ok} de ${st.tot} tarefas prontas</small></div>
     <label class="chk"><input type="checkbox" data-act="mostrar" ${mostrar?'checked':''}> Mostrar o que já terminei</label></div>
   ${foco?`<div class="focus"><div style="flex:1;min-width:220px"><div class="lbl">Seu próximo passo</div><div class="txt">${esc(foco.txt)}</div></div>${foco.btn}</div>`
         :`<div class="focus done"><div><div class="lbl">Pronto</div><div class="txt">${esc(s)} está concluído este mês.</div></div></div>`}
   <div class="frotas">${cards}</div>`;
}
function linha(f,a,t){
  const n=prox(t);
  let dica='';
  if((a.k==='vida'||a.k==='fc')&&!t.na&&t.s===null&&f.t.hor.s===null&&!f.t.hor.na)dica='<small>depende do horímetro</small>';
  if(a.k==='hor'&&f.base)dica=f.base.tot?(f.base.des?`<small class="basenote bad">base: ${f.base.des} de ${f.base.tot} desatualizados</small>`:`<small class="basenote good">base: tudo em dia</small>`):'<small>não achei na base</small>';
  const passos=PASSOS.map((p,i)=>{const v=t[p.c], on=v!==null, nx=i===n;
    let sd='';
    if(on&&v){const d=dias(v);sd=d===0?'hoje':d===1?'ontem':`${fmt(v).slice(0,5)}`}
    if(nx&&i===1&&t.e){const d=dias(t.e);if(d!==null&&d>=S.cfg.dias)sd=`<span class="sd late">esperando há ${d} dias</span>`;else if(d!==null)sd=`esperando há ${d} dia${d===1?'':'s'}`}
    return `<button class="step ${on?'on':''} ${nx?'next':''}" type="button" data-act="passo" data-fid="${f.id}" data-k="${a.k}" data-i="${i}" aria-label="${p.n}${on?' (feito, clique para desfazer)':''}">
      <span class="dot">${on?'✓':i+1}</span><span class="sl">${p.n}</span><span class="sd">${sd}</span></button>`}).join('');
  return `<div class="row ${t.na?'na':''} ${feita(t)?'feita':''}"><div class="an">${a.n}${t.na?'<small>não se aplica</small>':dica}</div>
    <div class="steps">${passos}</div>
    <button class="nabtn" type="button" data-act="na" data-fid="${f.id}" data-k="${a.k}" aria-pressed="${t.na}" title="Não se aplica">N/A</button></div>`;
}
function vAjustes(){
  return `<div class="box"><h2>Mês</h2><p>Mês que você está controlando agora.</p>
    <div class="acts"><input type="month" value="${esc(S.mes)}" data-set="mes"> <button class="btn y" type="button" data-act="fechar">Fechar o mês e começar o próximo</button></div></div>
   <div class="box"><h2>Backup no Excel</h2><p>Os dados ficam salvos neste navegador. Exporte de vez em quando para ter uma cópia. Para restaurar, importe o arquivo exportado (ou a planilha antiga de controle).</p>
    <div class="acts"><button class="btn" type="button" data-act="exportar">Exportar Excel</button><button class="btn" type="button" data-act="importar">Importar Excel</button></div></div>
   <div class="box"><h2>Lembrete de reforço</h2><p>Depois de quantos dias sem resposta a tarefa fica vermelha.</p>
    <div class="acts"><input type="number" min="1" max="31" value="${S.cfg.dias}" data-set="dias" style="width:80px"> dias</div></div>
   <div class="box"><h2>Frotas</h2><p>Cada cliente vira uma aba. "Cliente na base" e "Modelos" servem para achar a frota no Relatório de Equipamentos.</p>
    <div class="tw"><table><thead><tr><th>Cliente (aba)</th><th>Frota</th><th>Responsável</th><th>Cliente na base</th><th>Modelos</th><th></th></tr></thead><tbody>
    ${S.frotas.map(f=>`<tr><td><input value="${esc(f.cliente)}" data-fid="${f.id}" data-f="cliente"></td><td><input value="${esc(f.frota)}" data-fid="${f.id}" data-f="frota"></td><td><input value="${esc(f.resp)}" data-fid="${f.id}" data-f="resp"></td><td><input value="${esc(f.baseCliente||'')}" data-fid="${f.id}" data-f="baseCliente"></td><td><input value="${esc((f.modelos||[]).join(', '))}" data-fid="${f.id}" data-f="modelos"></td><td><button class="btn link" type="button" data-act="rm" data-fid="${f.id}">remover</button></td></tr>`).join('')}
    </tbody></table></div><div class="acts" style="margin-top:10px"><button class="btn" type="button" data-act="add">Adicionar frota</button></div></div>`;
}

/* ---------- Excel ---------- */
function ler(file){return new Promise((res,rej)=>{if(typeof XLSX==='undefined'){rej(new Error('Sem internet: o leitor de Excel não carregou.'));return}const r=new FileReader();r.onload=()=>{try{res(XLSX.read(new Uint8Array(r.result),{type:'array'}))}catch(e){rej(new Error('Arquivo inválido.'))}};r.onerror=()=>rej(new Error('Não consegui ler o arquivo.'));r.readAsArrayBuffer(file)})}
function baixar(wb,nome){const b=new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})]);const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}
function linhasMes(){const out=[];S.frotas.forEach(f=>ATV.forEach(a=>{const t=f.t[a.k];out.push({data:t.e||'',cli:f.cliente,frota:f.frota,resp:f.resp,atv:a.n,sit:situacao(t),receb:t.na?'NA':t.r!==null?'Sim':'Não',sis:t.na?'NA':t.s!==null?'Sim':'Não',orig:'',origem:'Fechamento'})}));return out}
function exportar(){
  if(typeof XLSX==='undefined'){toast('Sem internet: não consigo gerar o Excel agora.');return}
  const wb=XLSX.utils.book_new();
  const v=x=>x===null?'':(x||'Sim');
  const t=[['CLIENTE','FROTA','RESPONSÁVEL','ATIVIDADE','NÃO SE APLICA','E-MAIL ENVIADO EM','RESPOSTA RECEBIDA EM','CONCLUÍDO EM','CLIENTE NA BASE','MODELOS','MÊS']];
  S.frotas.forEach(f=>ATV.forEach(a=>{const x=f.t[a.k];t.push([f.cliente,f.frota,f.resp,a.n,x.na?'Sim':'',v(x.e),v(x.r),v(x.s),f.baseCliente||'',(f.modelos||[]).join(', '),S.mes])}));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(t),'TAREFAS');
  const h=[['MÊS','DATA DA COBRANÇA','CLIENTE','FROTA','RESPONSÁVEL','ATIVIDADE','SITUAÇÃO','RECEBIDO DO RESP.','ATUALIZADO NO SISTEMA','STATUS ORIGINAL','ORIGEM']];
  Object.keys(H).sort().forEach(m=>H[m].forEach(l=>h.push([m,fmt(l.data),l.cli,l.frota,l.resp,l.atv,l.sit,l.receb,l.sis,l.orig,l.origem])));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(h),'HISTORICO');
  baixar(wb,`TAREFAS_GFC_${S.mes}.xlsx`);toast('Excel exportado para a pasta de Downloads.');
}
const serial=v=>{if(v===''||v==null)return null;if(typeof v==='number'){return new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5).toISOString().slice(0,10)}const s=String(v).trim();if(norm(s)==='SIM')return '';let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:null};
async function importar(file){
  try{
    const wb=await ler(file);let frotas=null,mes=S.mes;
    if(wb.Sheets['TAREFAS']){
      const rows=XLSX.utils.sheet_to_json(wb.Sheets['TAREFAS'],{header:1,raw:true,defval:''}).slice(1).filter(r=>r[0]);
      const mp=new Map();
      rows.forEach(r=>{const key=r[0]+'|'+r[1];if(!mp.has(key))mp.set(key,{id:uid(),cliente:String(r[0]),frota:String(r[1]),resp:String(r[2]),baseCliente:String(r[8]||''),modelos:String(r[9]||'').split(',').map(nm).filter(Boolean),obs:'',t:vazioT(),base:null});
        const a=ATV.find(x=>x.n===String(r[3]));if(!a)return;const f=mp.get(key);f.t[a.k]={na:norm(r[4])==='SIM',e:serial(r[5]),r:serial(r[6]),s:serial(r[7])};if(r[10])mes=String(r[10])});
      frotas=[...mp.values()];
    }else if(wb.Sheets['CONTROLE']){
      const aoa=XLSX.utils.sheet_to_json(wb.Sheets['CONTROLE'],{header:1,raw:true,defval:''});
      (aoa[1]||[]).forEach(c=>{if(/^\d{4}-\d{2}$/.test(String(c).trim()))mes=String(c).trim()});
      const dc=serial((aoa[1]||[]).find(c=>typeof c==='number'&&c>30000))||hoje();
      const hi=aoa.findIndex(r=>norm(r[0])==='CLIENTE'&&norm(r[1])==='FROTA');
      if(hi<0)throw new Error('Não achei o cabeçalho CLIENTE / FROTA.');
      frotas=[];
      for(let i=hi+1;i<aoa.length;i++){const r=aoa[i];if(!String(r[0]).trim()||norm(r[0]).startsWith('COMO'))break;
        const Y=x=>norm(x)==='SIM', N=x=>norm(x)==='NA';const t=vazioT();
        [['mapa',3],['hor',6]].forEach(([k,c])=>{t[k]={na:N(r[c+1])||N(r[c+2]),s:Y(r[c+2])?'':null,r:(Y(r[c+1])||Y(r[c+2]))?'':null,e:(Y(r[c])||Y(r[c+1])||Y(r[c+2]))?dc:null}});
        t.rom={na:N(r[9])||N(r[10]),s:Y(r[10])?'':null,r:(Y(r[9])||Y(r[10]))?'':null,e:(Y(r[9])||Y(r[10]))?dc:null};
        [['vida',11],['fc',12]].forEach(([k,c])=>{const y=Y(r[c]);t[k]={na:N(r[c]),e:y?dc:null,r:y?'':null,s:y?'':null}});
        const ant=S.frotas.find(f=>norm(f.cliente)===norm(r[0])&&norm(f.frota)===norm(r[1]));
        frotas.push({id:uid(),cliente:String(r[0]).trim(),frota:String(r[1]).trim(),resp:String(r[2]).trim(),baseCliente:ant?ant.baseCliente:'',modelos:ant?ant.modelos:String(r[1]).split(/,|\se\s/).map(nm).filter(Boolean),obs:String(r[13]||''),t,base:null})}
    }else throw new Error('Não achei as abas TAREFAS ou CONTROLE nesse arquivo.');
    if(!frotas.length)throw new Error('Nenhuma frota encontrada no arquivo.');
    if(!confirm(`Substituir o controle atual pelas ${frotas.length} frotas do arquivo?`))return;
    S.frotas=frotas;S.mes=mes;
    const wh=wb.Sheets['HISTORICO'];
    if(wh){const hm={};XLSX.utils.sheet_to_json(wh,{header:1,raw:true,defval:''}).forEach(r=>{const m=String(r[0]).trim();if(!/^\d{4}-\d{2}$/.test(m))return;(hm[m]=hm[m]||[]).push({data:serial(r[1])||'',cli:String(r[2]),frota:String(r[3]),resp:String(r[4]),atv:String(r[5]),sit:String(r[6]),receb:String(r[7]),sis:String(r[8]),orig:String(r[9]),origem:String(r[10])})});Object.assign(H,hm)}
    salvar();aba='geral';render();toast(`Importado: ${frotas.length} frotas.`);
  }catch(e){toast(e.message)}
}
async function importarBase(file){
  try{
    const wb=await ler(file);const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
    const hi=aoa.findIndex(r=>norm(r[0])==='CLIENTE'&&r.some(c=>norm(c)==='STATUS DO HORIMETRO'));
    if(hi<0)throw new Error('Esse arquivo não parece o Relatório de Equipamentos (falta "Status do Horímetro").');
    const Hd=aoa[hi].map(norm),c=n=>Hd.indexOf(norm(n));
    const C={cli:c('Cliente'),mod:c('Modelo'),sh:c('Status do Horímetro'),est:c('Estado')};
    const rows=aoa.slice(hi+1).filter(r=>r[C.cli]).map(r=>({cli:String(r[C.cli]).trim(),mod:nm(r[C.mod]),sh:String(r[C.sh]),est:String(r[C.est]).trim()}));
    const clientes=[...new Set(rows.map(r=>r.cli))];
    let concl=0,pend=0;
    S.frotas.forEach(f=>{
      if(!f.baseCliente){const k=CLI_KEY[norm(f.cliente)];const hit=k&&clientes.find(x=>norm(x).includes(norm(k)));if(hit)f.baseCliente=hit}
      const el=rows.filter(r=>norm(r.cli)===norm(f.baseCliente)&&(f.modelos||[]).includes(r.mod)&&r.est!=='Descartado'&&r.est!=='Hibernado');
      const des=el.filter(r=>/^desatualizado/i.test(r.sh.trim())).length;
      f.base={tot:el.length,des};
      const t=f.t.hor;if(!el.length||t.na)return;
      if(!des){if(t.s===null){['e','r','s'].forEach(k=>{if(t[k]===null)t[k]=hoje()});concl++}}
      else{if(t.s!==null)t.s=null;pend++}
    });
    salvar();render();toast(`Base lida. ${concl} horímetro${concl===1?'':'s'} marcado${concl===1?'':'s'} como concluído${concl===1?'':'s'}; ${pend} frota${pend===1?'':'s'} ainda com equipamento desatualizado.`);
  }catch(e){toast(e.message)}
}
function proxMes(m){const [y,mm]=m.split('-').map(Number);const d=new Date(y,mm,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function fecharMes(){
  const st=statsDe(S.frotas);
  if(!confirm(`Fechar ${mesNome(S.mes)} com ${st.p}% concluído?\n\nO mês vai para o histórico${H[S.mes]?' (substituindo o fechamento anterior)':''} e ${mesNome(proxMes(S.mes))} começa zerado. Os "N/A" continuam marcados.`))return;
  H[S.mes]=linhasMes();const m=S.mes;S.mes=proxMes(m);
  S.frotas.forEach(f=>{ATV.forEach(a=>{const na=f.t[a.k].na;f.t[a.k]={e:null,r:null,s:null,na}});f.base=null});
  salvar();aba='geral';render();toast(`${mesNome(m)} fechado. Bom começo de ${mesNome(S.mes)}!`);
}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act],[data-aba]');if(!b)return;
  if(b.dataset.aba){aba=b.dataset.aba;render();window.scrollTo({top:0});return}
  const a=b.dataset.act,fid=b.dataset.fid;
  if(a==='passo')return clicarPasso(fid,b.dataset.k,+b.dataset.i);
  if(a==='na')return toggleNA(fid,b.dataset.k);
  if(a==='undo')return desfazer();
  if(a==='toastFn'){hideToast();tFn&&tFn();return}
  if(a==='email')return copiarEmail(fid);
  if(a==='mostrar'){S.cfg.mostrarFeitas=b.checked;salvar();render();return}
  if(a==='base')return $('#fBase').click();
  if(a==='importar')return $('#fImp').click();
  if(a==='exportar')return exportar();
  if(a==='fechar')return fecharMes();
  if(a==='fechaDlg')return $('#dlg').close();
  if(a==='add'){S.frotas.push({id:uid(),cliente:'Novo site',frota:'',resp:'',modelos:[],baseCliente:'',obs:'',t:vazioT(),base:null});salvar();render();return}
  if(a==='rm'){const f=S.frotas.find(x=>x.id===fid);if(confirm(`Remover ${f.cliente} · ${f.frota}?`)){S.frotas=S.frotas.filter(x=>x.id!==fid);salvar();render()}return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='fBase'&&t.files[0]){importarBase(t.files[0]);t.value='';return}
  if(t.id==='fImp'&&t.files[0]){importar(t.files[0]);t.value='';return}
  if(t.dataset.set==='mes'&&t.value){S.mes=t.value;salvar();render();return}
  if(t.dataset.set==='dias'){S.cfg.dias=Math.max(1,parseInt(t.value)||5);salvar();render();return}
  if(t.dataset.f){const f=S.frotas.find(x=>x.id===t.dataset.fid);if(!f)return;f[t.dataset.f]=t.dataset.f==='modelos'?t.value.split(',').map(nm).filter(Boolean):t.value.trim();salvar();render()}
});

carregar();render();
</script>
